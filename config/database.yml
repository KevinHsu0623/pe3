# config/database.yml
default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  database: pe3_development

test:
  <<: *default
  database: pe3_test

production:
  # 主要應用程式連線
  primary: &prod_primary
    <<: *default
    url: <%= ENV["DATABASE_URL"] %>

  # SolidCable 用的「cable」連線（與 primary 同一個 DB 也可以）
  cable:
    <<: *prod_primary
