# config/database.yml
default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  primary:
    <<: *default
    database: pe3_development
  queue:
    <<: *default
    database: pe3_development_queue
  cache:
    <<: *default
    database: pe3_development_cache
  cable:
    <<: *default
    database: pe3_development_cable

test:
  primary:
    <<: *default
    database: pe3_test
  queue:
    <<: *default
    database: pe3_test_queue
  cache:
    <<: *default
    database: pe3_test_cache
  cable:
    <<: *default
    database: pe3_test_cable

production:
  primary:
    <<: *default
    url: <%= ENV["DATABASE_URL"] %>
  queue:
    <<: *default
    url: <%= ENV["DATABASE_URL"] %>
  cache:
    <<: *default
    url: <%= ENV["DATABASE_URL"] %>
  cable:
    <<: *default
    url: <%= ENV["DATABASE_URL"] %>
