# config/database.yml
default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS", 5) %>

development:
  <<: *default
  database: pe3_development

test:
  <<: *default
  database: pe3_test

# 重要：production 一律用 URL，避免 host/user/password 寫死
production:
  primary:
    <<: *default
    url: <%= ENV.fetch("DATABASE_URL") %>
  queue:
    <<: *default
    url: <%= ENV.fetch("QUEUE_DATABASE_URL", ENV.fetch("DATABASE_URL")) %>
  cache:
    <<: *default
    url: <%= ENV.fetch("CACHE_DATABASE_URL",  ENV.fetch("DATABASE_URL")) %>
  cable:
    <<: *default
    url: <%= ENV.fetch("CABLE_DATABASE_URL",  ENV.fetch("DATABASE_URL")) %>
