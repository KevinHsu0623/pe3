# config/database.yml
default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS", 5) %>

development:
  <<: *default
  database: pe3_development

test:
  <<: *default
  database: pe3_test

# 重要：production 一律用 URL，避免 host/user/password 寫死
production:
  <<: *default
  # 優先吃 DATABASE_URL，沒有的話給一個本機預設，避免編譯期噴錯
  url: <%= ENV["DATABASE_URL"] || "postgresql://user:pass@localhost:5432/pe3_production" %>
  pool: <%= ENV.fetch("RAILS_MAX_THREADS", 5) %>
