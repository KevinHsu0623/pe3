services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        RAILS_MASTER_KEY: ${RAILS_MASTER_KEY}
    image: ghcr.io/<你的GitHub帳號>/pe3:latest
    env_file: .env.production
    depends_on:
      - db
    ports:
      - "3000:3000"
    restart: always

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: pe3
      POSTGRES_PASSWORD: pe3password
      POSTGRES_DB: pe3_production
    volumes:
      - pe3_db:/var/lib/postgresql/data
    restart: always

volumes:
  pe3_db:
