services:
  - type: web
    name: pe3-web
    env: ruby
    plan: starter
    buildCommand: ./render-build.sh
    startCommand: bundle exec puma -C config/puma.rb
    postDeployCommand: bundle exec rails db:migrate
    envVars:
      - key: RAILS_ENV
        value: production
      - key: RAILS_MASTER_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: pe3-db
          property: connectionString
    healthCheckPath: /up
    autoDeploy: true
databases:
  - name: pe3-db
    plan: starter
    databaseName: pe3_production
    user: pe3
